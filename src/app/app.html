<app-en-tete></app-en-tete>
<main class="contenu-principal">
  <section class="liste-container">
    <app-liste-cours
      (courSelectionne)="onSelectionCours($event)">
    </app-liste-cours>
  </section>

  <aside class="detail-container">
    <app-detail-cours [cours]="courSelectionne"></app-detail-cours>
  </aside>
</main>

@defer (on viewport) {
  <app-pied-page></app-pied-page>
} @placeholder {
  <div class="pied-page-placeholder">
    Le pied de page sera chargé ici.
  </div>
} @loading {
  <p>Chargement...</p>
}
