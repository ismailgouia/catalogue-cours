<section class="liste-cours">
    @for(c of cours; track c.titre ){
        <article class="carte-cours">
            <h2>{{c.titre}}</h2>
            <p>Catégorie {{c.categorie}}</p>
            <p>Durée {{c.duree}}</p>
            <p>Places Disponibles {{c.places}}</p>
        </article>
    }
</section>
